name: Build PYP Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Android & Firebase Configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --verbose > build_log.txt 2>&1
          EXIT_CODE=$?
          echo "=== BUILD LOG TAIL ==="
          tail -n 150 build_log.txt
          exit $EXIT_CODE

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-failure-log
          path: build_log.txt

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PYP-PickYourPhotographer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
