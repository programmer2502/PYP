name: Build PYP Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Canonical Android Scaffolding
        run: |
          echo "Generating official Android platform scaffolding from Flutter..."
          rm -rf android
          flutter create --platforms=android --org=com.pyp.lensmatch temp_platform
          cp -r temp_platform/android ./android
          rm -rf temp_platform
          
          # Enable MultiDex and MinSdk 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYP-PickYourPhotographer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
