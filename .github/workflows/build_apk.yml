name: Build PYP Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Android & Firebase Configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee /tmp/flutter_build.log
          cp build/app/outputs/flutter-apk/app-release.apk ./PYP-PickYourPhotographer.apk

      - name: Publish Diagnostics on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-diagnostics
          name: "Build Failure Diagnostics"
          body: "Build failed on runner. Log attached."
          draft: false
          prerelease: true
          files: |
            /tmp/flutter_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PYP-PickYourPhotographer-Release-APK
          path: ./PYP-PickYourPhotographer.apk

      - name: Publish GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PYP Mobile App v1.0.0 (Release APK)"
          body: |
            ### 📸 PYP - Pick Your Photographer Android App
            Official Android Release v1.0.0
            
            #### Direct Phone Installation:
            - **Download APK**: [PYP-PickYourPhotographer.apk](https://github.com/programmer2502/PYP/releases/download/v1.0.0/PYP-PickYourPhotographer.apk)
            
            #### Installation Instructions:
            1. Download the APK file on your Android phone.
            2. Tap the downloaded file to install.
            3. If prompted, enable **Allow from this source**.
          draft: false
          prerelease: false
          files: |
            ./PYP-PickYourPhotographer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
