name: lensmatch
description: "PYP - Pick Your Photographer. On-demand photographer booking and portfolio platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  table_calendar: ^3.1.2
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.1.2
  razorpay_flutter: ^1.3.7
  shimmer: ^3.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  http: ^1.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

